<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Deposit Modal - Simple</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7f9fb; }
    .btn { padding:12px 18px; border-radius:8px; border:0; background:#1565ff; color:#fff; cursor:pointer; font-weight:600; }
  </style>
</head>
<body>
  <button id="openModalBtn" class="btn">Open Buyer Deposit</button>

  <!-- Include the modal script (save real-estate-deposit-modal.js in same folder) -->
  <script src="real-estate-deposit-modal.js"></script>

  <script>
    // Attach the modal to the button. This handles creating and opening the modal.
    // You can also call RealEstateDepositModal.create(...) and open() manually.
    (function () {
      const btn = document.getElementById('openModalBtn');

      // options with handlers
      const options = {
        onSubmit: async (data) => {
          // In a real app you'd send data to backend or create a blockchain tx.
          console.log('onSubmit payload:', data);
          alert('Deposit submitted for ' + data.property + '\\nAmount: $' + data.amount + (data.wallet ? '\\nWallet: ' + data.wallet : '\\n(no wallet)'));
          // simulate network latency
          await new Promise(resolve => setTimeout(resolve, 600));
        },
        onConnect: (account) => {
          console.log('Wallet connected:', account);
        }
      };

      // attach binds the modal to the button and returns the modal instance
      const inst = RealEstateDepositModal.attach(btn, options);

      // Optional: if you need to open programmatically later:
      // inst.open();
    })();
  </script>
</body>
</html>
