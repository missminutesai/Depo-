<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Test - Open Deposit Modal</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7f9fb; }
    .btn { padding:12px 18px; border-radius:8px; border:0; background:#1565ff; color:#fff; cursor:pointer; font-weight:600; }
    .note { margin-top:12px; font-size:13px; color:#334; text-align:center; }
    .wrap { text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="openBtn" class="btn">Open Buyer Deposit</button>
    <div class="note">Make sure <code>real-estate-deposit-modal.js</code> is in the same folder or paste its code above the demo script.</div>
  </div>

  <!-- Load the modal script (place the JS file next to this HTML) -->
  <script src="real-estate-deposit-modal.js"></script>

  <script>
    // Minimal wiring: create modal once and open when button clicked.
    // If you don't have the external JS file, paste the modal script here instead.
    document.getElementById('openBtn').addEventListener('click', function () {
      if (!window.RealEstateDepositModal) {
        alert('real-estate-deposit-modal.js not found. Save the JS file next to this HTML or paste its contents into this file.');
        return;
      }
      // create a modal instance and open it
      const modal = RealEstateDepositModal.create({
        onSubmit: (data) => {
          console.log('Submitted:', data);
          alert('Submitted deposit for ' + data.property + ' — $' + data.amount);
        },
        onConnect: (acct) => console.log('Wallet connected:', acct)
      });
      modal.open();
    });
  </script>
</body>
</html>
